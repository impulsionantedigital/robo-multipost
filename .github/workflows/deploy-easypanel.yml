---
# Build da imagem do app (só amd64) e deploy automático no Easypanel.
#
# A cada push em `main`: builda Dockerfile.dev, publica em
# ghcr.io/<owner>/robo-multipost:main (+ :sha-<commit>) e chama o
# Deploy Webhook do Easypanel, que baixa a imagem nova e reinicia o app.
#
# Pré-requisitos (ver docs/planning/easypanel-descentralizado.md):
# - secret EASYPANEL_DEPLOY_WEBHOOK com a URL do Deploy Webhook do serviço
#   (se não existir, o build roda mas o deploy é pulado)
# - pacote do GHCR público, ou credenciais do registry no Easypanel
name: "Deploy Easypanel"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Pushes seguidos: cancela o build antigo e fica só com o mais recente.
concurrency:
  group: deploy-easypanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nome da imagem
        id: meta
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/robo-multipost" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_VERSION=main-${{ steps.meta.outputs.short_sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Disparar deploy no Easypanel
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::EASYPANEL_DEPLOY_WEBHOOK não configurado — imagem publicada, deploy não disparado."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK"
          echo "Deploy disparado: ${{ steps.meta.outputs.image }}:main (sha-${{ steps.meta.outputs.short_sha }})"
